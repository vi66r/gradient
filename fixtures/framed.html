<!doctype html><meta charset="utf-8"><style>body{font:14px system-ui;margin:8px;color:#283146}</style>
<button id="ask">Camera from this frame</button> <span id="result">Not asked.</span>
<script>
document.getElementById('ask').onclick=async()=>{try{await navigator.mediaDevices.getUserMedia({video:true});document.getElementById('result').textContent='allowed (should not happen)';}catch(e){document.getElementById('result').textContent=e.name;}};
</script>
