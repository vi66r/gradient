<!doctype html><meta charset="utf-8"><title>Fixture sign-in</title><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>body{font:16px system-ui;margin:0;background:#fff;color:#283146}main{max-width:420px;margin:48px auto}button{margin:8px 8px 8px 0;padding:10px 14px;border:0;background:#456ae6;color:white;border-radius:8px}output{display:block;font:14px ui-monospace,monospace}</style>
<main><h1>Sign in</h1><output id="opener"></output><output id="storage"></output>
<button id="finish">Continue</button></main>
<script>
document.getElementById('opener').textContent=window.opener?'window.opener is the page that opened this.':'No window.opener.';
document.getElementById('storage').textContent='Visits in this website data store: '+(localStorage.getItem('sitesVisits')||0);
document.getElementById('finish').onclick=()=>{
  if(window.opener)window.opener.postMessage({token:'fixture-'+Math.random().toString(36).slice(2,8)},location.origin);
  window.close();
};
</script>
